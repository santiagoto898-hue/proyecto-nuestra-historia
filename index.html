<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Histórico - Bogotá, Cundinamarca y Sumapaz</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
 <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Botón Flotante para Ubicación GPS -->
  <button id="btn-location" title="Mi ubicación actual">📍</button>

  <!-- Ventana Modal de Detalles Históricos -->
  <div id="modal-historico" class="modal oculto">
    <div class="modal-contenido">
      <span id="cerrar-modal" class="cerrar">&times;</span>
      <h2 id="modal-titulo">Cargando...</h2>
      <div class="modal-info">
        <span id="modal-fecha" class="badge-fecha"></span>
        <span id="modal-categoria" class="badge-categoria"></span>
      </div>
      
      <div class="galeria-lado-a-lado">
  <figure class="foto-par">
    <span class="etiqueta-foto">Antes</span>
    <img id="modal-img-antes" class="img-ampliable" src="" alt="Imagen histórica del lugar">
  </figure>
  <figure class="foto-par">
    <span class="etiqueta-foto">Ahora</span>
    <img id="modal-img-ahora" class="img-ampliable" src="" alt="Estado actual del lugar">
  </figure>
</div>

      <p id="modal-descripcion"></p>

      <h3>Fuentes y Referencias:</h3>
      <ul id="modal-links"></ul>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <!-- Visor de imagen ampliada (Lightbox) -->
  <div id="modal-visor-imagen" class="modal oculto">
    <div class="modal-contenido-visor">
      <span id="cerrar-visor">&times;</span>
      <img id="imagen-ampliada" src="" alt="Imagen ampliada">
    </div>
  </div>
  <div id="visor-fullscreen" class="visor-fullscreen oculto" aria-hidden="true">
  <button id="cerrar-visor" class="visor-cerrar" aria-label="Cerrar imagen">&times;</button>

  <div class="visor-pista" id="visor-pista">
    <div class="visor-slide" data-slide="0">
      <span class="visor-epoca">Antes</span>
      <img id="visor-img-antes" src="" alt="Vista ampliada antes">
    </div>
    <div class="visor-slide" data-slide="1">
      <span class="visor-epoca">Ahora</span>
      <img id="visor-img-ahora" src="" alt="Vista ampliada ahora">
    </div>
  </div>

  <div class="visor-dots" id="visor-dots">
    <span class="visor-dot activo"></span>
    <span class="visor-dot"></span>
  </div>
</div>
</body>
</html>
